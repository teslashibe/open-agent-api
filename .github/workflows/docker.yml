# Build/push ghcr.io/teslashibe/codex-chat-api, then pin-bump k8s-control.
# Flux watches k8s-control@main and applies the change:
#   - push to main  -> bump manifests/dev  to sha-<short>
#   - push of a v*  -> bump manifests/prod to vX.Y.Z
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sync-smore-growth-auth-circuit:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    concurrency: smore-growth-auth-circuit
    steps:
      - name: Checkout codex-chat-api caller contract
        uses: actions/checkout@v7

      - name: Checkout smore
        uses: actions/checkout@v7
        with:
          repository: teslashibe/smore
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          path: smore

      - uses: actions/setup-go@v6
        with:
          go-version-file: smore/backend/go.mod
          cache-dependency-path: smore/backend/go.sum

      - name: Apply Growth upstream-auth circuit breaker
        run: |
          set -euo pipefail
          PATCH="deploy/smore/growth-auth-circuit.patch"
          if git -C smore apply --reverse --check "../$PATCH"; then
            echo "Growth auth circuit patch is already present in smore."
          else
            git -C smore apply --check "../$PATCH"
            git -C smore apply "../$PATCH"
          fi

      - name: Test Growth upstream-auth circuit breaker
        working-directory: smore/backend
        env:
          GOPRIVATE: github.com/teslashibe/*
          GONOSUMDB: github.com/teslashibe/*
          GOPRIVATE_GITHUB_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${GOPRIVATE_GITHUB_TOKEN}@github.com/teslashibe/".insteadOf "https://github.com/teslashibe/"
          go test ./internal/draftingtool ./internal/growthleads ./internal/outbox ./cmd/server

      - name: Commit and push caller circuit to smore
        working-directory: smore
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No smore caller change; nothing to commit."
            exit 0
          fi
          git config user.name "codex-chat-api-ci[bot]"
          git config user.email "codex-chat-api-ci@users.noreply.github.com"
          git add backend/cmd/server/mcpwiring.go \
            backend/internal/draftingtool/openrouter.go \
            backend/internal/draftingtool/openrouter_auth_circuit_test.go \
            backend/internal/growthleads/worker.go \
            backend/internal/growthleads/worker_auth_circuit_test.go \
            backend/internal/outbox/worker.go \
            backend/internal/outbox/worker_auth_circuit_test.go
          git commit -m "fix(growth): pause LLM workers on upstream auth failure"
          git push origin main

  deploy:
    needs: [build-and-push, sync-smore-growth-auth-circuit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codex-chat-api deployment contract
        uses: actions/checkout@v7

      - name: Checkout k8s-control
        uses: actions/checkout@v7
        with:
          repository: teslashibe/k8s-control
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          path: k8s-control

      - name: Resolve target env + image tag
        id: target
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
            echo "file=manifests/prod/kustomization.yaml" >> "$GITHUB_OUTPUT"
            echo "patch=manifests/prod/codex-chat-api-runtime-hardening.yaml" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
            echo "file=manifests/dev/kustomization.yaml" >> "$GITHUB_OUTPUT"
            echo "patch=manifests/dev/codex-chat-api-runtime-hardening.yaml" >> "$GITHUB_OUTPUT"
            echo "tag=sha-$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump codex-chat-api image pin
        working-directory: k8s-control
        run: |
          set -euo pipefail
          FILE="${{ steps.target.outputs.file }}"
          TAG="${{ steps.target.outputs.tag }}"
          if ! grep -q 'ghcr.io/teslashibe/codex-chat-api:' "$FILE"; then
            echo "deploy verification failed: no codex-chat-api image pin in ${FILE}" >&2
            exit 1
          fi
          sed -i -E "s#ghcr\.io/teslashibe/codex-chat-api:[^[:space:]]+#ghcr.io/teslashibe/codex-chat-api:${TAG}#g" "$FILE"
          if ! grep -q "ghcr.io/teslashibe/codex-chat-api:${TAG}" "$FILE"; then
            echo "deploy verification failed: codex-chat-api was not pinned to ${TAG}" >&2
            exit 1
          fi
          echo "---- diff ----"
          git --no-pager diff -- "$FILE" || true

      - name: Enforce Codex auth runtime and readiness
        working-directory: k8s-control
        run: |
          set -euo pipefail
          FILE="${{ steps.target.outputs.file }}"
          PATCH="${{ steps.target.outputs.patch }}"
          cp ../deploy/kubernetes/runtime-hardening-patch.yaml "$PATCH"
          ruby -ryaml -e '
            file, patch = ARGV
            data = YAML.load_file(file)
            entries = (data["patches"] ||= [])
            entries << {"path" => File.basename(patch)} unless entries.any? { |entry| entry.is_a?(Hash) && entry["path"] == File.basename(patch) }
            File.write(file, YAML.dump(data))
          ' "$FILE" "$PATCH"
          grep -q 'path: codex-chat-api-runtime-hardening.yaml' "$FILE"
          grep -A8 'readinessProbe:' "$PATCH" | grep -q 'path: /ready'
          echo "---- runtime hardening diff ----"
          git --no-pager diff -- "$FILE" "$PATCH" || true

      - name: Commit & push to k8s-control
        working-directory: k8s-control
        run: |
          set -euo pipefail
          FILE="${{ steps.target.outputs.file }}"
          PATCH="${{ steps.target.outputs.patch }}"
          if [ -z "$(git status --porcelain -- "$FILE" "$PATCH")" ]; then
            echo "No deployment change for ${{ steps.target.outputs.env }}; nothing to commit."
            exit 0
          fi
          git config user.name "codex-chat-api-ci[bot]"
          git config user.email "codex-chat-api-ci@users.noreply.github.com"
          git add "$FILE" "$PATCH"
          git commit -m "deploy(codex-chat-api): ${{ steps.target.outputs.env }} -> ${{ steps.target.outputs.tag }} with auth readiness"
          git push origin main
