# Build/push ghcr.io/teslashibe/codex-chat-api, then pin-bump k8s-control.
# Flux watches k8s-control@main and applies the change:
#   - push to main  -> bump manifests/dev  to sha-<short>
#   - push of a v*  -> bump manifests/prod to vX.Y.Z
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            IMAGE_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout k8s-control
        uses: actions/checkout@v7
        with:
          repository: teslashibe/k8s-control
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main

      - name: Resolve target env + image tag
        id: target
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
            echo "file=manifests/prod/kustomization.yaml" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
            echo "file=manifests/dev/kustomization.yaml" >> "$GITHUB_OUTPUT"
            echo "tag=sha-$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump codex-chat-api image pin
        run: |
          set -euo pipefail
          FILE="${{ steps.target.outputs.file }}"
          TAG="${{ steps.target.outputs.tag }}"
          if ! grep -q 'ghcr.io/teslashibe/codex-chat-api:' "$FILE"; then
            echo "deploy verification failed: no codex-chat-api image pin in ${FILE}" >&2
            exit 1
          fi
          sed -i -E "s#ghcr\.io/teslashibe/codex-chat-api:[^[:space:]]+#ghcr.io/teslashibe/codex-chat-api:${TAG}#g" "$FILE"
          if ! grep -q "ghcr.io/teslashibe/codex-chat-api:${TAG}" "$FILE"; then
            echo "deploy verification failed: codex-chat-api was not pinned to ${TAG}" >&2
            exit 1
          fi
          echo "---- diff ----"
          git --no-pager diff -- "$FILE" || true

      - name: Commit & push to k8s-control
        run: |
          set -euo pipefail
          FILE="${{ steps.target.outputs.file }}"
          if git diff --quiet -- "$FILE"; then
            echo "No image change for ${{ steps.target.outputs.env }}; nothing to commit."
            exit 0
          fi
          git config user.name "codex-chat-api-ci[bot]"
          git config user.email "codex-chat-api-ci@users.noreply.github.com"
          git add "$FILE"
          git commit -m "deploy(codex-chat-api): ${{ steps.target.outputs.env }} -> ${{ steps.target.outputs.tag }}"
          git push origin main
