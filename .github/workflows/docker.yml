# Build/push ghcr.io/teslashibe/open-agent-api, then pin-bump k8s-control.
# Flux watches k8s-control@main and applies the change:
#   - push to main  -> bump manifests/dev  to sha-<short>
#   - push of a v*  -> bump manifests/prod to vX.Y.Z
#
# During the rename from open-chat-api / codex-chat-api, the pin-bump accepts
# any of those image names in k8s-control and rewrites it to open-agent-api.
# CI also dual-publishes temporary aliases for the old image names.
#
# Nothing is published or rolled out unless the Go gate passes first, and
# nothing is rolled out unless the built image boots and reports the provenance
# of this exact commit: checks -> build-and-push -> verify-provenance -> deploy.
name: docker

concurrency:
  group: open-agent-api-release-${{ github.ref_type == 'tag' && 'prod' || github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Same-workflow gate. workflow_run gating would not block this workflow's push.
  checks:
    uses: ./.github/workflows/go-checks.yml

  build-and-push:
    needs: [checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ghcr.io/teslashibe/open-chat-api
            ghcr.io/teslashibe/codex-chat-api
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # UTC, RFC3339 with a literal Z — the shape verify-provenance asserts.
      - id: provenance
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # meta.outputs.version is the tag name on v*, branch/short-sha on main.
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.provenance.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Boot the image this run just produced (pinned by digest, not by tag) and make
  # it prove over /health that it carries this commit's provenance.
  verify-provenance:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GATEWAY_PROVIDERS=codex keeps startup credential-free: the codex client
      # only reads codex_profile.json / codex_scaffold.json, both baked into the
      # image at /app. Gemini and Claude need auth that a runner does not have.
      - name: Start the built image
        run: |
          set -euo pipefail
          docker run -d --name provenance -p 8088:8088 \
            -e GATEWAY_PROVIDERS=codex \
            ghcr.io/${{ github.repository }}@${{ needs.build-and-push.outputs.digest }} \
            --host 0.0.0.0 --port 8088

      - name: Assert /health reports this commit
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8088/health -o health.json; then
              break
            fi
            if [ "$i" = "30" ]; then
              echo "gateway did not become healthy within 60s" >&2
              exit 1
            fi
            sleep 2
          done

          cat health.json
          jq -e '.status == "ok"' health.json > /dev/null
          jq -e '.build.commit == "${{ github.sha }}"' health.json > /dev/null
          jq -e '.build.commit != "unknown"' health.json > /dev/null
          jq -e '.build.version != "devel"' health.json > /dev/null
          jq -e '.build.build_date != "unknown"' health.json > /dev/null
          jq -e '.build.build_date | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$")' health.json > /dev/null

      - name: Container logs
        if: failure()
        run: docker logs provenance || true

      - name: Clean up
        if: always()
        run: docker rm -f provenance || true

  deploy:
    needs: [build-and-push, verify-provenance]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout k8s-control
        uses: actions/checkout@v7
        with:
          repository: teslashibe/k8s-control
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main

      - name: Resolve target env + image tag
        id: target
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            echo "env=prod" >> "$GITHUB_OUTPUT"
            echo "file=manifests/prod/kustomization.yaml" >> "$GITHUB_OUTPUT"
            echo "eu_file=manifests/smore-agents/internal-services/kustomization.yaml" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
            echo "file=manifests/dev/kustomization.yaml" >> "$GITHUB_OUTPUT"
            echo "eu_file=" >> "$GITHUB_OUTPUT"
            echo "tag=sha-$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump open-agent-api image pin
        run: |
          set -euo pipefail
          FILE="${{ steps.target.outputs.file }}"
          TAG="${{ steps.target.outputs.tag }}"
          EU_FILE="${{ steps.target.outputs.eu_file }}"
          if [ -n "$EU_FILE" ]; then
            PROD_TAG="$(sed -nE 's#.*ghcr\.io/teslashibe/(open-agent-api|open-chat-api|codex-chat-api):([^[:space:]]+).*#\2#p' "$FILE" | head -1)"
            EU_TAG="$(sed -nE 's#.*value: ghcr\.io/teslashibe/(open-agent-api|open-chat-api|codex-chat-api):([^[:space:]]+).*#\2#p' "$EU_FILE")"
            FORWARD_DEPLOY="$(python3 - "$PROD_TAG" "$EU_TAG" "$TAG" <<'PY'
          import re
          import sys

          def version(value):
              match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", value)
              if not match:
                  raise SystemExit(f"invalid release tag: {value}")
              return tuple(map(int, match.groups()))

          target = version(sys.argv[3])
          print("yes" if target > version(sys.argv[1]) and target > version(sys.argv[2]) else "no")
          PY
            )"
            if [ "$FORWARD_DEPLOY" != "yes" ]; then
              echo "Prod/EU already pin ${PROD_TAG}/${EU_TAG}; refusing non-forward deploy ${TAG}"
              exit 0
            fi
          fi
          if grep -qE 'ghcr\.io/teslashibe/(open-agent-api|open-chat-api|codex-chat-api):' "$FILE"; then
            sed -i -E "s#ghcr\.io/teslashibe/(open-agent-api|open-chat-api|codex-chat-api):[^[:space:]]+#ghcr.io/teslashibe/open-agent-api:${TAG}#g" "$FILE"
          else
            echo "deploy verification failed: no open-agent-api/open-chat-api/codex-chat-api image pin in ${FILE}" >&2
            exit 1
          fi
          if ! grep -q "ghcr.io/teslashibe/open-agent-api:${TAG}" "$FILE"; then
            echo "deploy verification failed: open-agent-api was not pinned to ${TAG}" >&2
            exit 1
          fi
          if [ -n "$EU_FILE" ]; then
            if ! grep -qE 'value: ghcr\.io/teslashibe/(open-agent-api|open-chat-api|codex-chat-api):' "$EU_FILE"; then
              echo "deploy verification failed: no EU open-agent-api image pin in ${EU_FILE}" >&2
              exit 1
            fi
            sed -i -E "s#value: ghcr\\.io/teslashibe/(open-agent-api|open-chat-api|codex-chat-api):[^[:space:]]+#value: ghcr.io/teslashibe/open-agent-api:${TAG}#g" "$EU_FILE"
            if ! grep -q "value: ghcr.io/teslashibe/open-agent-api:${TAG}" "$EU_FILE"; then
              echo "deploy verification failed: EU open-agent-api was not pinned to ${TAG}" >&2
              exit 1
            fi
          fi
          echo "---- diff ----"
          git --no-pager diff -- "$FILE" ${EU_FILE:+"$EU_FILE"} || true

      - name: Commit & push to k8s-control
        run: |
          set -euo pipefail
          FILE="${{ steps.target.outputs.file }}"
          EU_FILE="${{ steps.target.outputs.eu_file }}"
          if git diff --quiet -- "$FILE" ${EU_FILE:+"$EU_FILE"}; then
            echo "No image change for ${{ steps.target.outputs.env }}; nothing to commit."
            exit 0
          fi
          git config user.name "open-agent-api-ci[bot]"
          git config user.email "open-agent-api-ci@users.noreply.github.com"
          git add "$FILE" ${EU_FILE:+"$EU_FILE"}
          if [ -n "$EU_FILE" ]; then
            git commit -m "deploy(open-agent-api): prod + eu -> ${{ steps.target.outputs.tag }}"
          else
            git commit -m "deploy(open-agent-api): ${{ steps.target.outputs.env }} -> ${{ steps.target.outputs.tag }}"
          fi
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Failed to push GitOps pins after 5 attempts" >&2
          exit 1
