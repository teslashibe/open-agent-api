name: PR quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Test
        run: go test ./...

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Race test concurrency-sensitive packages
        run: go test -race ./internal/codex ./internal/codextest ./internal/server

  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build .

  prom-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Prometheus alert rules
        run: |
          docker run --rm --entrypoint promtool \
            --volume "$PWD/examples/prometheus:/rules:ro" \
            --workdir /rules \
            prom/prometheus:v3.5.0 \
            check rules codex-chat-api.rules.yml

      - name: Test Prometheus alert rules
        run: |
          docker run --rm --entrypoint promtool \
            --volume "$PWD/examples/prometheus:/rules:ro" \
            --workdir /rules \
            prom/prometheus:v3.5.0 \
            test rules codex-chat-api.rules.test.yml
