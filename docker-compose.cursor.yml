# Local high-throughput baseline proven by the shared Cursor/Report Studio
# gateway. Compose with docker-compose.yml and docker-compose.ngrok.yml.
services:
  api:
    environment:
      CODEX_AGENT_QUEUE_ENABLED: "${CODEX_AGENT_QUEUE_ENABLED:-true}"
      CODEX_AGENT_QUEUE_PRIORITY_ENABLED: "${CODEX_AGENT_QUEUE_PRIORITY_ENABLED:-true}"
      CODEX_AGENT_MAX_ACTIVE: "${CODEX_AGENT_MAX_ACTIVE:-20}"
      CODEX_AGENT_MAX_ACTIVE_PER_KEY: "${CODEX_AGENT_MAX_ACTIVE_PER_KEY:-20}"
      CODEX_CLIENT_MAX_INFLIGHT: "${CODEX_CLIENT_MAX_INFLIGHT:-20}"
      CODEX_AGENT_QUEUE_LIMIT: "${CODEX_AGENT_QUEUE_LIMIT:-192}"
      CODEX_AGENT_QUEUE_TIMEOUT: "${CODEX_AGENT_QUEUE_TIMEOUT:-60m}"
      CODEX_CLIENT_COOLDOWN_DEFAULT: "${CODEX_CLIENT_COOLDOWN_DEFAULT:-1m}"
      CODEX_TIMEOUT: "${CODEX_TIMEOUT:-45m}"
      # Cursor can spend several minutes in valid silent reasoning. Disable the
      # frame-idle guard here and rely on request cancellation plus CODEX_TIMEOUT.
      CODEX_STREAM_IDLE_TIMEOUT: "${CODEX_STREAM_IDLE_TIMEOUT:-0s}"
      CODEX_METRICS_ENABLED: "${CODEX_METRICS_ENABLED:-true}"
      STRUCTURED_INFERENCE_ENABLED: "${STRUCTURED_INFERENCE_ENABLED:-true}"
      STRUCTURED_MAX_ACTIVE: "${STRUCTURED_MAX_ACTIVE:-20}"
      STRUCTURED_MAX_ACTIVE_PER_KEY: "${STRUCTURED_MAX_ACTIVE_PER_KEY:-20}"
      STRUCTURED_QUEUE_LIMIT: "${STRUCTURED_QUEUE_LIMIT:-192}"
      STRUCTURED_QUEUE_TIMEOUT: "${STRUCTURED_QUEUE_TIMEOUT:-60m}"
      STRUCTURED_MAX_DEADLINE: "${STRUCTURED_MAX_DEADLINE:-60m}"
      STRUCTURED_MODELS: "${STRUCTURED_MODELS:-gpt-5.6-sol,gpt-5.6-sol-fast,gpt-5.6-terra,gpt-5.6-terra-fast,gpt-5.6-luna,gpt-5.6-luna-fast,gpt-5.5}"
