# Public HTTPS tunnel for Cursor BYOK (preferred over cloudflared quick tunnels).
#
#   NGROK_DOMAIN=YOUR_SUBDOMAIN.ngrok-free.dev \
#   NGROK_AUTHTOKEN=... \
#   docker compose -f docker-compose.yml -f docker-compose.ngrok.yml up -d
#
# Cursor base URL: https://${NGROK_DOMAIN}/v1
# Inspector: http://127.0.0.1:4041

services:
  ngrok:
    # Pinned (tag + multi-arch digest); bump deliberately.
    image: ngrok/ngrok:3.39.11-alpine@sha256:187e588f6c4efe3b29cd3eea9fcd768a1afa7342319e3cee9aeb5af6a9cf64fd
    command:
      - http
      - api:8088
      - --url=https://${NGROK_DOMAIN:-YOUR_SUBDOMAIN.ngrok-free.dev}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "127.0.0.1:4041:4040"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
