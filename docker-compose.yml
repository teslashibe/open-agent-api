services:
  api:
    build:
      context: .
    image: teslashibe/codex-chat-api:local
    command: ["--host", "0.0.0.0", "--port", "8088"]
    environment:
      CODEX_HOME: /home/codex/.codex
      CODEX_LOG_BODY_SHAPE: "${CODEX_LOG_BODY_SHAPE:-true}"
      CODEX_LOG_REQUEST_IDENTITY: "${CODEX_LOG_REQUEST_IDENTITY:-false}"
      CODEX_AGENT_QUEUE_ENABLED: "${CODEX_AGENT_QUEUE_ENABLED:-true}"
      CODEX_AGENT_MAX_ACTIVE: "${CODEX_AGENT_MAX_ACTIVE:-2}"
      CODEX_AGENT_MAX_ACTIVE_PER_KEY: "${CODEX_AGENT_MAX_ACTIVE_PER_KEY:-1}"
      CODEX_AGENT_QUEUE_KEY_MODE: "${CODEX_AGENT_QUEUE_KEY_MODE:-header:x-cursor-session-id}"
      CODEX_AGENT_QUEUE_LIMIT: "${CODEX_AGENT_QUEUE_LIMIT:-20}"
      CODEX_AGENT_QUEUE_TIMEOUT: "${CODEX_AGENT_QUEUE_TIMEOUT:-5m}"
      CODEX_CONTEXT_MANAGEMENT_ENABLED: "${CODEX_CONTEXT_MANAGEMENT_ENABLED:-true}"
      CODEX_CONTEXT_MAX_BYTES: "${CODEX_CONTEXT_MAX_BYTES:-262144}"
      CODEX_CONTEXT_MAX_MESSAGES: "${CODEX_CONTEXT_MAX_MESSAGES:-150}"
      CODEX_CONTEXT_RECENT_MESSAGES: "${CODEX_CONTEXT_RECENT_MESSAGES:-40}"
      CODEX_CONTEXT_TOOL_OUTPUT_MAX_BYTES: "${CODEX_CONTEXT_TOOL_OUTPUT_MAX_BYTES:-65536}"
      CODEX_CONTEXT_COMPACTED_TOOL_OUTPUT_MAX_BYTES: "${CODEX_CONTEXT_COMPACTED_TOOL_OUTPUT_MAX_BYTES:-1024}"
    volumes:
      - "${HOME}/.codex:/home/codex/.codex:ro"
    ports:
      - "127.0.0.1:${CODEX_CHAT_API_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--url", "http://api:8088"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
