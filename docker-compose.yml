services:
  api:
    build:
      context: .
    image: teslashibe/codex-chat-api:local
    command: ["--host", "0.0.0.0", "--port", "8088"]
    environment:
      CODEX_HOME: /home/codex/.codex
      CODEX_LOG_BODY_SHAPE: "${CODEX_LOG_BODY_SHAPE:-true}"
    volumes:
      - "${HOME}/.codex:/home/codex/.codex:ro"
    ports:
      - "127.0.0.1:${CODEX_CHAT_API_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--url", "http://api:8088"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
