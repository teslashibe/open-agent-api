services:
  api:
    build:
      context: .
      args:
        # Optional build provenance. Unset values fall back to the Go
        # toolchain's VCS stamps; see GET /health.
        BUILD_VERSION: "${BUILD_VERSION:-}"
        BUILD_COMMIT: "${BUILD_COMMIT:-}"
        BUILD_DATE: "${BUILD_DATE:-}"
    image: teslashibe/open-agent-api:local
    command: ["--host", "0.0.0.0", "--port", "8088"]
    environment:
      CODEX_HOME: /home/codex/.codex
      CODEX_LOG_BODY_SHAPE: "${CODEX_LOG_BODY_SHAPE:-true}"
      CODEX_LOG_REQUEST_IDENTITY: "${CODEX_LOG_REQUEST_IDENTITY:-false}"
      CODEX_LOG_CODEX_TOOL_EVENTS: "${CODEX_LOG_CODEX_TOOL_EVENTS:-false}"
      CODEX_CLIENTS: "${CODEX_CLIENTS:-}"
      CODEX_CLIENT_POOL_UNAVAILABLE: "${CODEX_CLIENT_POOL_UNAVAILABLE:-fail}"
      CODEX_CLIENT_COOLDOWN_DEFAULT: "${CODEX_CLIENT_COOLDOWN_DEFAULT:-5m}"
      CODEX_AGENT_QUEUE_ENABLED: "${CODEX_AGENT_QUEUE_ENABLED:-true}"
      CODEX_AGENT_MAX_ACTIVE: "${CODEX_AGENT_MAX_ACTIVE:-4}"
      CODEX_AGENT_MAX_ACTIVE_PER_KEY: "${CODEX_AGENT_MAX_ACTIVE_PER_KEY:-1}"
      CODEX_AGENT_QUEUE_KEY_MODE: "${CODEX_AGENT_QUEUE_KEY_MODE:-cursor}"
      CODEX_AGENT_QUEUE_LIMIT: "${CODEX_AGENT_QUEUE_LIMIT:-20}"
      CODEX_AGENT_QUEUE_TIMEOUT: "${CODEX_AGENT_QUEUE_TIMEOUT:-5m}"
      # Queues are per provider; caps apply to each queue. Gemini/Claude
      # inherit the CODEX_ values above unless overridden here.
      GEMINI_AGENT_MAX_ACTIVE: "${GEMINI_AGENT_MAX_ACTIVE:-}"
      GEMINI_AGENT_MAX_ACTIVE_PER_KEY: "${GEMINI_AGENT_MAX_ACTIVE_PER_KEY:-}"
      GEMINI_AGENT_QUEUE_LIMIT: "${GEMINI_AGENT_QUEUE_LIMIT:-}"
      CLAUDE_AGENT_MAX_ACTIVE: "${CLAUDE_AGENT_MAX_ACTIVE:-}"
      CLAUDE_AGENT_MAX_ACTIVE_PER_KEY: "${CLAUDE_AGENT_MAX_ACTIVE_PER_KEY:-}"
      CLAUDE_AGENT_QUEUE_LIMIT: "${CLAUDE_AGENT_QUEUE_LIMIT:-}"
      # Structured inference (POST /v1/structured/inference) ships dark and has
      # its own admission budget so it can never starve Cursor/agent traffic.
      STRUCTURED_INFERENCE_ENABLED: "${STRUCTURED_INFERENCE_ENABLED:-false}"
      STRUCTURED_MAX_ACTIVE: "${STRUCTURED_MAX_ACTIVE:-}"
      STRUCTURED_MAX_ACTIVE_PER_KEY: "${STRUCTURED_MAX_ACTIVE_PER_KEY:-}"
      STRUCTURED_QUEUE_LIMIT: "${STRUCTURED_QUEUE_LIMIT:-}"
      STRUCTURED_MODELS: "${STRUCTURED_MODELS:-}"
      # Idempotency: "memory" is process-local. Switch to "file" and share the
      # directory between replicas to make replay durable across restarts; more
      # than one replica on "memory" is refused at startup.
      STRUCTURED_IDEMPOTENCY_BACKEND: "${STRUCTURED_IDEMPOTENCY_BACKEND:-memory}"
      STRUCTURED_IDEMPOTENCY_DIR: "${STRUCTURED_IDEMPOTENCY_DIR:-/var/lib/open-agent-api/structured-idempotency}"
      STRUCTURED_IDEMPOTENCY_TTL: "${STRUCTURED_IDEMPOTENCY_TTL:-}"
      STRUCTURED_REPLICAS: "${STRUCTURED_REPLICAS:-1}"
      # 240s: deep-reasoning turns pause >90s without streaming; healthy
      # turns were killed at 90s (observed 2026-07-07).
      CODEX_STREAM_IDLE_TIMEOUT: "${CODEX_STREAM_IDLE_TIMEOUT:-240s}"
      # Cursor BYOK drops type:"custom" tool calls; function shape is the default.
      CODEX_CUSTOM_TOOL_WIRE: "${CODEX_CUSTOM_TOOL_WIRE:-function}"
      CODEX_TIMEOUT: "${CODEX_TIMEOUT:-10m}"
      GEMINI_TIMEOUT: "${GEMINI_TIMEOUT:-10m}"
      # Prefer Antigravity oauth (synced via scripts/sync-antigravity-auth.sh).
      GEMINI_AUTH_PATH: "${GEMINI_AUTH_PATH:-/home/codex/.gemini/antigravity_oauth_creds.json}"
      CLAUDE_TIMEOUT: "${CLAUDE_TIMEOUT:-10m}"
      CODEX_AGENT_QUEUE_LOCK_DIR: "${CODEX_AGENT_QUEUE_LOCK_DIR:-/var/lib/open-agent-api/agent-locks}"
      CODEX_CONTEXT_MANAGEMENT_ENABLED: "${CODEX_CONTEXT_MANAGEMENT_ENABLED:-true}"
      CODEX_CONTEXT_MAX_BYTES: "${CODEX_CONTEXT_MAX_BYTES:-196608}"
      CODEX_CONTEXT_MAX_MESSAGES: "${CODEX_CONTEXT_MAX_MESSAGES:-120}"
      CODEX_CONTEXT_RECENT_MESSAGES: "${CODEX_CONTEXT_RECENT_MESSAGES:-24}"
      CODEX_CONTEXT_TOOL_OUTPUT_MAX_BYTES: "${CODEX_CONTEXT_TOOL_OUTPUT_MAX_BYTES:-32768}"
      CODEX_CONTEXT_COMPACTED_TOOL_OUTPUT_MAX_BYTES: "${CODEX_CONTEXT_COMPACTED_TOOL_OUTPUT_MAX_BYTES:-512}"
      CODEX_DEGENERATE_TURN_RETRY: "${CODEX_DEGENERATE_TURN_RETRY:-true}"
      HOME: /home/codex
      CLAUDE_EXECUTABLE: "${CLAUDE_EXECUTABLE:-claude}"
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"
      CLAUDE_CODE_OAUTH_REFRESH_TOKEN: "${CLAUDE_CODE_OAUTH_REFRESH_TOKEN:-}"
      ANTHROPIC_AUTH_TOKEN: "${ANTHROPIC_AUTH_TOKEN:-}"
    volumes:
      - "${HOME}/.codex:/home/codex/.codex:ro"
      - "${HOME}/.gemini:/home/codex/.gemini"
      - "${HOME}/.claude:/home/codex/.claude"
      # No ~/.claude.json bind: the host CLI replaces that file via atomic
      # rename, leaving the container a stale truncated inode ("config
      # corrupted"). Auth comes from CLAUDE_CODE_OAUTH_TOKEN (.env); the
      # container CLI maintains its own config in its own HOME.
      - "agent-queue-locks:/var/lib/open-agent-api/agent-locks"
      # Structured idempotency records; only written when
      # STRUCTURED_IDEMPOTENCY_BACKEND=file. Holds extracted payloads at rest.
      - "structured-idempotency:/var/lib/open-agent-api/structured-idempotency"
    ports:
      - "127.0.0.1:${CODEX_CHAT_API_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

volumes:
  agent-queue-locks:
  structured-idempotency:
